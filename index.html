        :root {

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #000 100%); }

        .wrapper { width: 90%; max-width: 450px; padding: 30px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 35px; text-align: center; position: relative; }

        .avatar { width: 110px; height: 110px; border-radius: 30px; margin-bottom: 20px; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(99, 102, 241, 0.4); }

        .timer-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 20px; border: 1px solid var(--primary); }
        .timer-text { font-size: 14px; color: var(--primary); font-weight: 600; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card { background: rgba(255,255,255,0.04); padding: 15px; border-radius: 20px; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); }

        .card i { font-size: 20px; color: var(--accent); margin-bottom: 8px; display: block; }
        .card h3 { font-size: 13px; margin-bottom: 4px; }
        .card p { font-size: 9px; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }

        .cta { display: block; width: 100%; padding: 18px; background: linear-gradient(90deg, var(--primary), #818cf8); color: white; font-weight: 700; border-radius: 20px; text-decoration: none; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #18181b; border: 1px solid #3f3f46; padding: 12px 20px; border-radius: 15px; display: flex; align-items: center; gap: 10px; opacity: 0; transition: 0.4s; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

    <script>
        let timeLeft = 15;
        const timerDisplay = document.getElementById('countdown');

            timeLeft--;

            if (timeLeft <= 0) {

        function showNotification() {
            toastText.textContent = names[Math.floor(Math.random() * names.length)] + " joined the Army";
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 1000);
        }

        setTimeout(() => {
            showNotification();
            setInterval(showNotification, 2500);
        }, 1000);
