<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKURO ARMY | Elite Strategic Gaming Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d4ff;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); }

        .wrapper { width: 95%; max-width: 500px; padding: 40px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }

        .avatar { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent); }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tagline { color: #888; margin-bottom: 30px; letter-spacing: 1px; font-weight: 300; }

        .features { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .feature-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .feature-card h3 { color: var(--accent); font-size: 14px; margin-bottom: 5px; }
        .feature-card p { font-size: 10px; color: #666; }

        .cta-btn { display: block; width: 100%; padding: 20px; background: var(--accent); color: #000; font-weight: 800; font-size: 1.1rem; border-radius: 15px; text-decoration: none; transition: 0.3s; box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
        .cta-btn:hover { transform: translateY(-5px); box-shadow: 0 0 30px rgba(0, 212, 255, 0.6); }

        .footer { margin-top: 40px; color: #444; font-size: 12px; text-decoration: none; transition: 0.3s; }
        .footer:hover { color: var(--accent); }

        /* Notification Styling */
        .toast { position: fixed; bottom: 30px; right: 20px; background: #111; border: 1px solid var(--accent); padding: 12px 20px; border-radius: 50px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); opacity: 0; transition: 0.5s; }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="https://i.ibb.co/fGM1p3DP/tg-img-Da-LAD7.jpg" alt="AKURO" class="avatar">
        <h1>AKURO ARMY</h1>
        <p class="tagline">ELITE STRATEGIC GAMING COMMUNITY</p>

        <div class="features">
            <div class="feature-card"><h3>ANALYTICS</h3><p>Real-time data insights</p></div>
            <div class="feature-card"><h3>COMMUNITY</h3><p>Elite player network</p></div>
            <div class="feature-card"><h3>STRATEGY</h3><p>Advanced skill building</p></div>
            <div class="feature-card"><h3>ACCESS</h3><p>Exclusive daily reports</p></div>
        </div>

        <a href="https://telegram.me/+WG4kxJobaoQ4YTk9" class="cta-btn">JOIN ELITE ARMY</a>
        
        <a href="https://t.me/GODXOWNER17" class="footer">Ads managed by @GODXOWNER17</a>
    </div>

    <div class="toast" id="toast">
        <div style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%;"></div>
        <span id="toast-text" style="font-size: 13px;">Aryan just joined</span>
    </div>

    <script>
        const names = ["Aryan", "Riya", "Ishan", "Meera", "Vikram", "Anjali", "Kabir", "Sneha", "Aditya", "Priya"];
        function showNotification() {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').textContent = names[Math.floor(Math.random() * names.length)] + " joined the Army";
            t.style.opacity = "1";
            setTimeout(() => { t.style.opacity = "0"; }, 3000);
        }
        setInterval(showNotification, 6000);
    </script>
</body>
</html>
